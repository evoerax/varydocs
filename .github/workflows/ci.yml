name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.12.0", "24"]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm test
      - run: pnpm build
      - name: Install test Chromium
        if: matrix.node == '24'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Install the release tarballs in fresh npm and pnpm projects
        env:
          VARYDOCS_SMOKE_ASSISTANT_BROWSER: ${{ matrix.node == '24' && '1' || '0' }}
        run: |
          pnpm pack:local
          pnpm check:pack
          node scripts/smoke-release.mjs
      - name: Check reader accessibility and search loading
        if: matrix.node == '24'
        run: |
          pnpm qa:reader
          pnpm qa:search
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24' && always()
        with:
          name: reader-qa
          path: .varydocs/reader-qa/
          include-hidden-files: true
